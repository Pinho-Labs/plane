# Builds the Plane FORK images (Pinho Labs) and publishes them to ghcr.io.
# Consumed by the manifests in infra-manifests/apps/pinholabs-plane-prod/.
#
# Trigger: manual (workflow_dispatch) + push to the `preview` branch (the fork's
# default branch, where we work). Since we don't sync upstream, `preview` = our changes.
#
# Prerequisites in the fork repo (github.com/Pinho-Labs/plane):
#   - Settings -> Actions -> Workflow permissions: "Read and write" (so GITHUB_TOKEN
#     can push to ghcr). Already covered by the `permissions:` block below.
#   - The 5 ghcr packages are created PRIVATE. The cluster pulls them with the `ghcr`
#     pull secret (see infra-manifests/apps/pinholabs-plane-prod/README.md).
#
# The frontends (web/admin/space) bake the URLs/paths at BUILD time. The Dockerfile
# DEFAULTS already match our setup (base paths /god-mode //spaces //live //api,
# empty base URLs = same origin). If the domain ever changes, pass build-args here.
name: pinholabs-images

on:
  workflow_dispatch:
  push:
    branches: [preview]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            dockerfile: ./apps/web/Dockerfile.web
          - name: admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
          - name: space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
          - name: live
            context: .
            dockerfile: ./apps/live/Dockerfile.live
          - name: backend
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image ref (owner lowercased)
        id: img
        run: echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/plane-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.img.outputs.repo }}:${{ github.sha }}
            ${{ steps.img.outputs.repo }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # Writes this build's SHA into the infra-manifests manifests and pushes -> Argo CD
  # does the rolling update. Same GitOps pattern as exemplo-app (CI writes the SHA, we
  # never pin by hand). Uses the GitHub App (MANIFESTS_APP_ID/KEY) to write to the OTHER repo.
  #
  # Prerequisites in the fork repo (Pinho-Labs/plane) -> Settings -> Secrets and variables -> Actions:
  #   - Variable  MANIFESTS_APP_ID   (the App ID — same App as exemplo-app)
  #   - Secret    MANIFESTS_APP_KEY  (the App's .pem private key)
  # The App must be installed on the felipesantoos/infra-manifests repo with Contents: Read and write.
  update-manifest:
    needs: build                 # only after the 5 builds pass
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token (infra-manifests)
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.MANIFESTS_APP_ID }}
          private-key: ${{ secrets.MANIFESTS_APP_KEY }}
          owner: felipesantoos
          repositories: infra-manifests

      - name: Checkout infra-manifests
        uses: actions/checkout@v4
        with:
          repository: felipesantoos/infra-manifests
          token: ${{ steps.app-token.outputs.token }}

      - name: Pin the 5 images to this commit's SHA
        run: |
          set -e
          D=apps/pinholabs-plane-prod
          if [ ! -d "$D" ]; then
            echo "Manifests not committed to infra-manifests yet — skipping (do push #2 first)."
            exit 0
          fi
          sed -i "s#ghcr.io/pinho-labs/plane-backend:.*#ghcr.io/pinho-labs/plane-backend:${{ github.sha }}#g" "$D/backend.yaml"
          for svc in web admin space live; do
            sed -i "s#ghcr.io/pinho-labs/plane-$svc:.*#ghcr.io/pinho-labs/plane-$svc:${{ github.sha }}#g" "$D/frontend.yaml"
          done

      - name: Commit & push (triggers Argo CD)
        run: |
          git config user.name  "pinholabs-manifest-bot"
          git config user.email "manifest-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "Manifests were already at SHA ${{ github.sha }}."
          else
            git commit -am "plane: deploy ${{ github.sha }}"
            git push
          fi
