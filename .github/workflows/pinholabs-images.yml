# Builda as imagens do FORK do Plane (Pinho Labs) e publica no ghcr.io.
# Consumidas pelos manifests em infra-manifests/apps/pinholabs-plane-prod/.
#
# Gatilho: manual (workflow_dispatch) + push na branch `preview` (a branch padrão do
# fork, onde você mexe). Como você não sincroniza o upstream, `preview` = suas mudanças.
#
# Pré-requisitos no repo do fork (github.com/Pinho-Labs/plane):
#   - Settings → Actions → Workflow permissions: "Read and write" (pro GITHUB_TOKEN
#     conseguir dar push no ghcr). Já coberto pelo `permissions:` abaixo.
#   - Os 5 pacotes ghcr nascem PRIVADOS. O cluster puxa com o pull secret `ghcr`
#     (ver infra-manifests/apps/pinholabs-plane-prod/README.md).
#
# Os frontends (web/admin/space) bakeiam as URLs/paths no BUILD. Os DEFAULTS dos
# Dockerfiles já batem com o nosso setup (base paths /god-mode //spaces //live //api,
# base URLs vazias = mesma origem). Se um dia trocar o domínio, passe build-args aqui.
name: pinholabs-images

on:
  workflow_dispatch:
  push:
    branches: [preview]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            dockerfile: ./apps/web/Dockerfile.web
          - name: admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
          - name: space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
          - name: live
            context: .
            dockerfile: ./apps/live/Dockerfile.live
          - name: backend
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image ref (owner lowercased)
        id: img
        run: echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/plane-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.img.outputs.repo }}:${{ github.sha }}
            ${{ steps.img.outputs.repo }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # Escreve o SHA deste build nos manifests do infra-manifests e dá push → o Argo CD
  # faz o rolling update. Mesmo padrão GitOps do exemplo-app (CI escreve o SHA, você
  # nunca pina à mão). Usa o GitHub App (MANIFESTS_APP_ID/KEY) pra escrever no OUTRO repo.
  #
  # Pré-requisitos no repo do fork (Pinho-Labs/plane) → Settings → Secrets and variables → Actions:
  #   - Variable  MANIFESTS_APP_ID   (o App ID — mesmo App do exemplo-app)
  #   - Secret    MANIFESTS_APP_KEY  (a private key .pem do App)
  # O App precisa estar instalado no repo felipesantoos/infra-manifests com Contents: Read and write.
  update-manifest:
    needs: build                 # só depois dos 5 builds passarem
    runs-on: ubuntu-latest
    steps:
      - name: Gerar token do GitHub App (escopo: infra-manifests)
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.MANIFESTS_APP_ID }}
          private-key: ${{ secrets.MANIFESTS_APP_KEY }}
          owner: felipesantoos
          repositories: infra-manifests

      - name: Checkout do infra-manifests
        uses: actions/checkout@v4
        with:
          repository: felipesantoos/infra-manifests
          token: ${{ steps.app-token.outputs.token }}

      - name: Fixar as 5 imagens no SHA deste commit
        run: |
          set -e
          D=apps/pinholabs-plane-prod
          if [ ! -d "$D" ]; then
            echo "Manifests ainda não commitados no infra-manifests — pulando (faça o push #2 primeiro)."
            exit 0
          fi
          sed -i "s#ghcr.io/pinho-labs/plane-backend:.*#ghcr.io/pinho-labs/plane-backend:${{ github.sha }}#g" "$D/backend.yaml"
          for svc in web admin space live; do
            sed -i "s#ghcr.io/pinho-labs/plane-$svc:.*#ghcr.io/pinho-labs/plane-$svc:${{ github.sha }}#g" "$D/frontend.yaml"
          done

      - name: Commit & push (dispara o Argo CD)
        run: |
          git config user.name  "pinholabs-manifest-bot"
          git config user.email "manifest-bot@users.noreply.github.com"
          if git diff --quiet; then
            echo "Manifests já estavam no SHA ${{ github.sha }}."
          else
            git commit -am "plane: deploy ${{ github.sha }}"
            git push
          fi
